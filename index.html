<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bcdaf8">
<title>羽羽英文村</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22366b; --plum:#3a5199;
  --card:#f8fcff; --card2:#dcebfb; --txt:#22366b; --sub:#5d76a6; --line:#2f4a8a;
  --coral:#ff9fae; --rose:#e8677f; --ribbon:#e0566f; --sky:#8ec2f5; --gold:#ffd3dc; --good:#3fbf85; --bad:#ef6f6c;
  --bg1:#eaf5ff; --bg2:#bcdaf8; --bg3:#84b2ec; --glow:#ffffff; --shadow:rgba(47,74,138,.25); --cloudA:1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --card:#26396f; --card2:#33508f; --txt:#eaf4ff; --sub:#a9c3ea; --line:#0e1a3d;
    --bg1:#1b2a55; --bg2:#2d4a8a; --bg3:#5a86c8; --glow:#6f9be0; --shadow:rgba(0,0,0,.4); --gold:#5a6fb0; --cloudA:.3;
  }
}
:root[data-theme="dark"]{
  --card:#26396f; --card2:#33508f; --txt:#eaf4ff; --sub:#a9c3ea; --line:#0e1a3d;
    --bg1:#1b2a55; --bg2:#2d4a8a; --bg3:#5a86c8; --glow:#6f9be0; --shadow:rgba(0,0,0,.4); --gold:#5a6fb0; --cloudA:.3;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(circle at 10% 6%,var(--glow) 0,transparent 36%),radial-gradient(circle at 50% 100%,rgba(255,255,255,.8),transparent 52%),linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;}
*{box-sizing:border-box}
body{height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;color:var(--txt);
  font-family:"Nunito","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-weight:600;font-size:16px;line-height:1.5;
  background:radial-gradient(circle at 10% 6%,var(--glow) 0,transparent 36%),radial-gradient(circle at 50% 100%,rgba(255,255,255,.8),transparent 52%),linear-gradient(170deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;
  -webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer}
b{font-weight:900}

/* watercolor sky */
.fallers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fallers::before{content:"";position:absolute;inset:-5% -8%;opacity:var(--cloudA);filter:blur(7px);animation:clouds 46s ease-in-out infinite alternate;
  background:radial-gradient(ellipse 42% 9% at 22% 14%,rgba(255,255,255,.95),transparent 72%),radial-gradient(ellipse 50% 11% at 80% 27%,rgba(255,255,255,.8),transparent 72%),radial-gradient(ellipse 40% 8% at 24% 52%,rgba(255,255,255,.7),transparent 72%),radial-gradient(ellipse 55% 10% at 84% 72%,rgba(255,255,255,.8),transparent 72%),radial-gradient(ellipse 35% 7% at 10% 86%,rgba(255,255,255,.7),transparent 72%)}
@keyframes clouds{to{transform:translateX(-5%)}}
.fall{position:absolute;bottom:-8vh;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.12));opacity:.75;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(24px,-58vh)}100%{transform:translate(-18px,-118vh)}}
.foam{position:fixed;left:0;right:0;bottom:0;width:100%;height:120px;z-index:0;pointer-events:none;opacity:var(--cloudA)}

#app{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:8px 14px 6px}
.hdt{flex:1;min-width:0}
.hdt b{display:block;font-size:17px;line-height:1.1;letter-spacing:.5px}
.xpbar{height:10px;border:2px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .6s}
.pill{border:2.5px solid var(--line);background:var(--card);border-radius:14px;padding:2px 10px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 24px}
nav.tabs{display:flex;gap:4px;padding:6px 8px 8px;margin:0 8px 8px;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--shadow)}
nav.tabs button{flex:1;border:0;background:transparent;border-radius:16px;padding:5px 0 3px;font-size:11px;font-weight:900;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:0}
nav.tabs button span{font-size:22px;line-height:1.2;transition:transform .2s}
nav.tabs button.on{background:var(--gold);color:var(--ink)}
nav.tabs button.on span{transform:translateY(-2px) scale(1.15)}
body.inquiz nav.tabs{display:none}

.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:14px;margin-bottom:14px}
.card h3,.sec{margin:0 0 8px;font-size:17px;font-weight:900}
.sec{margin:6px 4px 8px;color:var(--ink)}
:root[data-theme="dark"] .sec{color:var(--txt)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec{color:var(--txt)}}
.sub{color:var(--sub);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:3px solid var(--line);border-radius:16px;background:var(--gold);color:#22366b;font-weight:900;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.pink{background:var(--rose);color:#fff}
.btn.sky{background:var(--sky)}
.btn.good{background:var(--good);color:#fff}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.wide{width:100%}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:6px 8px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--shadow)}
.seg button.on{background:var(--gold);color:#22366b}

/* mascot */
.mascot{width:92px;height:92px;flex:none;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 92%}
.mascot.sm{width:46px;height:46px}
.mascot.md{width:64px;height:64px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.hop{animation:hop .6s !important}
@keyframes hop{30%{transform:translateY(-24px) scale(1.06,.94)}60%{transform:translateY(0) scale(.95,1.05)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--card),var(--card2))}
.hero h1{margin:0;font-size:26px;line-height:1.15;font-weight:900}
.bubble{position:relative;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:800}
.hero .bubble{margin-top:8px;background:#fff;color:#22366b}

/* quests / bars */
.qrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.qrow .ic{font-size:24px;width:34px;text-align:center}
.qrow .tt{flex:1;font-size:15px}
.bar{height:12px;border:2.5px solid var(--line);border-radius:9px;background:var(--card2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good);transition:width .5s}
.done{color:var(--good);font-weight:900}

.ucard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:12px 14px;margin-bottom:14px}
.ucard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.ucard .emo{font-size:40px;width:64px;height:64px;border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;flex:none}
.u8 .emo{background:linear-gradient(135deg,#d6ebff,#7fb8f0)}
.u9 .emo{background:linear-gradient(135deg,#ffe0e6,#f28ba0)}
.ucard b{font-size:18px;display:block;line-height:1.2}
.ucard .grow{flex:1;min-width:0}

/* flashcards */
.fcwrap{perspective:1000px;margin-bottom:12px}
.flip{position:relative;height:400px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card),var(--card2))}
.bigword{font-size:38px;font-weight:900;line-height:1.1;word-break:break-word}
.pos{display:inline-block;background:var(--sky);color:#22366b;border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:13px;font-weight:900}
.zhbig{font-size:26px;font-weight:900;line-height:1.3}
.tip{background:var(--card2);border:2px dashed var(--line);border-radius:14px;padding:6px 10px;font-size:14px;text-align:left}
.exbox{font-size:15px;text-align:left;width:100%}
.exbox b{color:var(--ribbon)}
.exbox .z{color:var(--sub);font-size:14px}
.fcnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:900}
.wl{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:2px dashed rgba(125,100,120,.35);cursor:pointer}
.wl:last-child{border:0}
.wl .en{font-weight:900;font-size:18px}
.wl .zh{display:none;color:var(--sub);font-size:14px}
.wl.open .zh{display:block}
.wl .grow{flex:1;min-width:0}
.spk{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:var(--sky);font-size:18px;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none;padding:0}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.spk.slow{background:var(--gold)}

/* reading */
.para{position:relative;font-size:18px;line-height:1.85;margin-bottom:6px}
.tok{cursor:pointer;border-radius:6px;padding:0 2px;font-weight:800;transition:background .15s}
.tok.wd{border-bottom:3px dotted var(--ribbon);background:rgba(232,103,127,.14)}
.tok.ph{border-bottom:3px solid var(--sky);background:rgba(127,184,240,.32)}
.tok:active{background:var(--gold)}
.zhp{display:none;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--card2);font-size:15px;line-height:1.7}
.zhp.show{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:10px}

/* sheet & modal */
#backdrop{position:fixed;inset:0;background:rgba(30,15,40,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#backdrop.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border:3px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.2,.5,1)}
#sheet.open{transform:translateY(0)}
.handle{width:44px;height:6px;border-radius:4px;background:var(--line);opacity:.3;margin:0 auto 10px}
.sh-en{font-size:28px;font-weight:900;line-height:1.15}
.sh-zh{font-size:20px;font-weight:900;margin:8px 0}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,15,40,.55);padding:20px}
#modal.open{display:flex}
#modal .box{background:var(--card);border:3px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--shadow);padding:22px;max-width:360px;width:100%;text-align:center;animation:pop .45s}
#modal .big{font-size:56px;line-height:1.1}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff6ea;border:2px solid #fff6ea33;border-radius:16px;padding:8px 16px;font-weight:900;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:toastin .35s cubic-bezier(.3,1.5,.5,1)}
.toast.out{opacity:0;transform:translateY(-14px);transition:.35s}
@keyframes toastin{from{transform:translateY(-30px) scale(.8);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* modes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--card);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--shadow);padding:12px 10px;text-align:center}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.mode .mi{font-size:34px;line-height:1.2}
.mode b{display:block;font-size:16px}
.mode .d{font-size:12.5px;color:var(--sub);line-height:1.3;min-height:32px}
.stars{font-size:18px;letter-spacing:2px;color:#e0a72e}
.stars .off{color:#bda9b6;opacity:.55}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .x{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-weight:900;box-shadow:0 3px 0 var(--shadow)}
.pbar{flex:1;height:16px;border:3px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--good));transition:width .4s}
.combo{font-weight:900;min-width:52px;text-align:right;opacity:.55}
.combo.hot{opacity:1;color:var(--ribbon);animation:pop .4s}
.qcard{text-align:center}
.qtitle{font-size:15px;color:var(--sub);font-weight:800;margin-bottom:8px}
.qsent{font-size:22px;line-height:1.55;font-weight:800}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--ribbon);color:var(--ribbon);font-weight:900;padding:0 6px}
.blank.fill{border-color:var(--good);color:var(--good)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:13px 16px;font-size:18px;font-weight:900;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);color:var(--txt);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--good);color:#fff;animation:pop .4s}
.opt.no{background:var(--bad);color:#fff;animation:shake .4s}
.opt.dim{opacity:.5}
.bigspk{width:96px;height:96px;font-size:44px;margin:6px auto}
.fb{margin-top:14px;display:none;align-items:center;gap:10px;border:3px solid var(--line);border-radius:20px;padding:10px 12px;background:var(--card);box-shadow:0 4px 0 var(--shadow);animation:slide .3s}
.fb.show{display:flex}
.fb.good{background:#d9f5e6;color:#20402f}
.fb.bad{background:#ffe0dc;color:#5a2626}
@keyframes slide{from{transform:translateY(20px);opacity:0}}
.fb .msg{flex:1;font-size:15px;line-height:1.45}
.zhq{font-size:21px;font-weight:900;margin:6px 0 12px;line-height:1.5}
.ans{min-height:66px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--card2);margin-bottom:12px}
.ans .ph{color:var(--sub);font-size:14px;align-self:center;margin:0 auto}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;min-height:50px}
.chip{border:3px solid var(--line);background:var(--card);color:var(--txt);border-radius:14px;padding:6px 12px;font-size:17px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--gold);color:#22366b}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* result */
.rstars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.star{font-size:60px;transform:scale(0);animation:pop .55s forwards;filter:drop-shadow(0 3px 0 rgba(45,34,56,.3))}
.star.off{filter:grayscale(1) opacity(.35)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.big{font-size:44px;font-weight:900;line-height:1.1}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat div{background:var(--card2);border-radius:14px;padding:8px 2px;border:2px solid var(--line)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:flex;gap:8px;align-items:center;padding:8px;border:3px solid var(--line);border-radius:16px;background:var(--card2)}
.badge .bi{font-size:30px;width:40px;text-align:center}
.badge.lock{opacity:.6}
.badge.lock .bi{filter:grayscale(1)}
.badge b{font-size:14px;line-height:1.2;display:block}
.badge small{font-size:11.5px;color:var(--sub);line-height:1.2;display:block}
.fgrid{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:2px solid var(--line);border-radius:12px;background:var(--card2);padding:2px 8px;font-size:13px;font-weight:800}
.fchip.lock{filter:grayscale(1);opacity:.45}
.lvl{font-size:22px;font-weight:900}

@media (prefers-reduced-motion: reduce){
  .fall,.mascot{animation:none}
  .flip{transition:none}
}
</style>
</head>

    <symbol id="feather" viewBox="0 0 40 100">
      <path d="M20 2 C35 24 37 62 20 98 C3 62 5 24 20 2Z" fill="currentColor"/>
      <path d="M20 12 L20 96" stroke="#fff" stroke-opacity=".3" stroke-width="1.6"/>

W(8,'coincidence','n.','巧合；碰巧的事','co-（一起）＋ incid（落下）→ 剛好一起落在同一點','It was a happy {coincidence} that we chose the same cafe.','我們挑了同一家咖啡店，真是個愉快的巧合。');
W(8,'invade','v.','入侵、侵略；侵犯','in-（進入）＋ vade（走）→ 走進別人的地盤','The army planned to {invade} the island at dawn.','軍隊計畫在黎明入侵這座島。');
W(8,'overthrow','v.','（尤指以武力）推翻、打倒','over（翻過去）＋ throw（丟）→ 把統治者翻倒。三態：overthrow–overthrew–overthrown','The rebels hoped to {overthrow} the cruel king.','反抗軍希望推翻殘暴的國王。');
W(8,'rigid','adj.','僵化的、不易改變的；死板的','想像一根硬梆梆、完全不會彎的尺','Her {rigid} schedule leaves no room for surprises.','她死板的行程表容不下任何驚喜。');
W(8,'labor','v.','勞動；辛苦工作（laboring 作形容詞：勞動的）','名詞 labor 是「勞動、勞工」，Labor Day 就是勞動節','Farmers {labor} in the fields from sunrise to sunset.','農夫從日出到日落都在田裡辛勤工作。');
W(8,'peasant','n.','（尤指舊時的）農民、佃農','集合名詞是 peasantry（農民階級）','A poor {peasant} gave part of his crops to the lord.','一位窮苦的農民把部分收成交給領主。');
W(8,'noble','n.','貴族；品德高尚的人','aristocracy 是「貴族階級、貴族統治階層」','The {noble} lived in a castle and owned a lot of land.','那位貴族住在城堡裡，擁有大片土地。');
W(8,'encounter','v.','（偶然）遇到；遭遇','en-（在…裡）＋ counter（相對）→ 迎面撞見','You might {encounter} a deer on this quiet trail.','你可能會在這條安靜的小徑上遇到一隻鹿。');
W(8,'feast','n.','盛宴、宴會','feast 和 fest（節慶）有親戚關係','The village held a {feast} to celebrate the harvest.','村民舉辦盛宴慶祝豐收。');
W(8,'merge','v.','合併、融合、結合','兩條河匯流成一條，就是 merge','Two small streams {merge} and become one river.','兩條小溪匯合成一條河。');
W(8,'distinct','adj.','有所區分的、截然不同的；顯著的','dis-（分開）＋ stinct（刺、戳）→ 被清楚分隔開的','The twins look alike, but their personalities are quite {distinct}.','雙胞胎長得很像，但個性截然不同。');
W(8,'endure','v.','持續存在、持久；忍受、忍耐','en-（使）＋ dur（硬、持久）→ 撐得久。dur 也在 during、duration','Some folk songs {endure} for hundreds of years.','有些民謠流傳了數百年。');
W(8,'reminder','n.','提醒物；提醒的人或事；提示','re-（再）＋ mind（記得）＋ -er → 讓你再想起的東西','This old photo is a sweet {reminder} of our trip.','這張舊照片甜蜜地提醒著我們那趟旅行。');
W(8,'linguistic','adj.','語言的；語言學的','lingu（舌頭、語言）→ 和 language 同源','She took a {linguistic} course on how languages change.','她修了一門關於語言如何演變的語言學課。',1);
W(8,'outlier','n.','異類；特例；與眾不同的人或事物','out（外面）＋ lie（位在）＋ -er → 站在圈外的那一個','In our class his score was an {outlier}, far above everyone else.','在班上，他的成績是個特例，遠高於其他人。',1);
W(8,'diner','n.','用餐者、食客；小餐館、美式餐館','dine（用餐）＋ -er → 用餐的人','The {diner} asked the waiter for the menu.','食客向服務生要了菜單。',1);
W(8,'conquest','n.','征服、占領；攻克','con-（完全）＋ quest（尋求）→ 一路追到手','The {conquest} of the castle took three long months.','攻下那座城堡花了整整三個月。',1);
W(8,'lavish','adj.','奢華的、豪華的；過於豐盛的','形容派對、宴會、禮物都很常見','They held a {lavish} wedding with a hundred dishes.','他們辦了一場有上百道菜的豪華婚禮。',1);
W(8,'conversely','adv.','相反地；反之','con-（一起）＋ vers（轉）→ 轉個方向來看','Some people love cities; {conversely}, others prefer quiet villages.','有些人愛城市；反之，有些人偏好安靜的村莊。',1);
W(8,'duality','n.','雙重性、二元性','du-（二）＋ -ity → 兩面性（dual、duo 同源）','The story explores the {duality} of good and evil.','這個故事探討善與惡的二元性。',1);
W(8,'medieval','adj.','中世紀的','medi（中間）＋ ev（時代）→ 「中間的時代」','Knights and kings lived in {medieval} Europe, long before modern times.','騎士和國王生活在中世紀的歐洲，遠在現代之前。',1);
/* Unit 9 */
W(9,'presentation','n.','報告、簡報；授予；呈現','pre-（前）＋ sent（在場）→ 站到大家面前呈現','She practiced her {presentation} in front of the mirror.','她對著鏡子練習簡報。');
W(9,'boost','v.','提升、增加；推動、促進（mood-boosting＝提振心情的）','boost 就像幫它「推一把」','A short walk can {boost} your mood.','短短散個步就能提振心情。');
W(9,'accomplish','v.','完成；達成、實現','ac-（去）＋ com-（完全）＋ plish（填滿）→ 把它做到圓滿','With teamwork, we can {accomplish} more.','只要團隊合作，我們能完成更多事。');
W(9,'purchase','n./v.','購買之物、購買行為；購買、採購','pur-（向前）＋ chase（追）→ 追到手買下來','Keep the receipt for every {purchase}.','每一筆購買都要保留收據。');
W(9,'trigger','v.','引發、觸發；（名詞）誘因、扳機','扣下扳機 → 引發一連串反應','Loud noises can {trigger} a headache.','很大的噪音可能引發頭痛。');
W(9,'psychology','n.','心理學','psycho（心靈）＋ -logy（…學）。形容詞 psychological、人 psychologist','She studies {psychology} to understand why people act the way they do.','她研讀心理學，想了解人為什麼會那樣行動。');
W(9,'stability','n.','穩定（性）；穩固','stab ＝ stand（站立）→ 站得穩。形容詞 stable、動詞 stabilize','A regular sleep schedule brings {stability} to your day.','規律的睡眠讓你的一天更穩定。');
W(9,'participant','n.','參加者、參與者','part（部分）＋ cip（拿取）＋ -ant（…的人）→ 拿走一份參與的人','Every {participant} received a small gift.','每位參加者都收到一份小禮物。');
W(9,'implication','n.','可能的影響、後果（常用複數）；含意、暗示','im-（進入）＋ plic（折疊）→ 折在裡面的意思','What is the {implication} of this new rule?','這條新規定會帶來什麼影響？');
W(9,'motivation','n.','動機、動力；積極性','mot（移動）→ 讓人動起來的力量。動詞 motivate','Prizes and praise can raise a student\'s {motivation} to study.','獎品和稱讚能提高學生的學習動力。');
W(9,'polished','adj.','優雅的；得體的；精緻熟練的','polish（擦亮）＋ -ed → 被擦得亮晶晶的','Her {polished} speech impressed the judges.','她精緻熟練的演說讓評審印象深刻。');
W(9,'outfit','n.','全套服裝；穿搭','out（外）＋ fit（裝備）→ 出門的整套裝備','I picked a bright {outfit} for the party.','我為派對挑了一套亮眼的穿搭。');
W(9,'reinforce','v.','強化、加強；鞏固','re-（再）＋ in ＋ force（力量）→ 再灌注力量','Daily practice will {reinforce} what you learned in class.','每天練習會鞏固你在課堂上學到的東西。');
W(9,'accessible','adj.','可取得的、可使用的；易接近的','ac-（去）＋ cess（走）＋ -ible（可…的）→ 走得到的。動詞 access','The library is {accessible} by bus and by bike.','搭公車或騎腳踏車都到得了圖書館。');
W(9,'wardrobe','n.','衣櫥、衣櫃；全部服裝','ward（看守）＋ robe（袍子）→ 看守衣服的地方','My {wardrobe} is full of blue shirts.','我的衣櫥裡全是藍色襯衫。',1);
W(9,'pandemic','n.','（疾病）大流行；流行病','pan-（全）＋ dem（人民）→ 影響全民的流行病','Schools moved online during the {pandemic}.','疫情期間，學校改成線上上課。',1);
W(9,'hue','n.','顏色；色調','和 color 幾乎同義，但更常指「色調」','The sky turned a warm pink {hue} at sunset.','日落時天空染上暖粉色調。',1);
W(9,'mindset','n.','心態；思維方式','mind（心）＋ set（設定）→ 心的設定','A growth {mindset} means seeing mistakes as chances to learn.','成長型心態就是把錯誤看成學習的機會。',1);
W(9,'precision','n.','精確性；精密度','pre-（事先）＋ cis（切）→ 事先切得整整齊齊 → 精確','The surgeon cut with great {precision}, never missing a millimeter.','外科醫生以極高的精準度下刀，連一公釐都不偏。',1);
W(9,'sharpen','v.','使更銳利、更敏銳；提升、改善（能力、思考）','sharp（銳利）＋ -en（使變成）→ 使變銳利','Please {sharpen} your pencil before the test.','考試前請把鉛筆削尖。',1);
const WD=Object.fromEntries(WORDS.map(w=>[w.id,w]));

const PASS={
 8:{title:'Beef Versus Cow',zh:'餐盤裡的英語歷史',note:'羽羽用自己的話改寫的課文重點版',paras:[
  {en:"Here is a puzzle. In many languages, one word names both the animal and its meat. English is an unusual [[outlier|outlier]]. Farm workers [[tend to|p_tend]] cows and pigs all day, yet once those animals reach a [[diner|diner]]'s plate, they get new names: beef and pork. This is no [[coincidence|coincidence]]. It comes from a [[conquest|conquest]] that took place almost a thousand years ago.",
   zh:"來個小謎題：在許多語言裡，同一個字既指動物、也指牠的肉。英語卻是個不尋常的特例。農場工人整天照顧牛和豬，但這些動物一到食客的盤子裡，就有了新名字：beef 和 pork。這不是巧合，而是近一千年前一場征服所留下的痕跡。"},
  {en:"In 1066, William, Duke of Normandy, sailed across the sea. His soldiers [[invaded|invade]] England and [[overthrew|overthrow]] the king. The new rulers built a [[rigid|rigid]] class system, with French-speaking [[nobles|noble]] at the top. Many local English people [[were reduced to|p_reduce]] poor farm workers, [[stripped of|p_strip]] their land and their power. They had to [[labor|labor]] in the fields as [[peasants|peasant]].",
   zh:"1066 年，諾曼第公爵威廉渡海而來。他的軍隊入侵英格蘭，推翻了國王。新統治者建立了僵化的階級制度，說法語的貴族站在最上層。許多當地英格蘭人淪為貧窮的農工，土地和權力都被剝奪，只能在田裡辛苦勞動，成為農民。"},
  {en:"For about three hundred years, two languages lived side by side. The peasants kept using English words for the animals they raised: cow, pig, sheep. But the meat rarely reached their own tables.",
   zh:"在接下來大約三百年裡，兩種語言並存。農民繼續用英語稱呼自己飼養的動物：cow、pig、sheep。但這些肉很少出現在他們自己的餐桌上。"},
  {en:"Meanwhile, the nobles spoke French. They seldom [[encountered|encounter]] a living cow. What reached them were finished dishes at [[lavish|lavish]] [[feasts|feast]]. So they used French-based words: boeuf, porc and mouton. Over time, these became beef, pork and mutton.",
   zh:"同時，貴族說的是法語。他們很少遇到活生生的牛，送到他們面前的只有奢華盛宴上的成品料理。所以他們用法語系的說法：boeuf、porc、mouton。久而久之，這些字變成了 beef、pork 和 mutton。"},
  {en:"Later, the two groups began to [[merge|merge]] into one people. Both sets of words stayed, but each kept a [[distinct|distinct]] job: animal names for the farm, meat names for the table. Veal and venison follow the same rule. [[Conversely|conversely]], chicken and fish were food for everybody, so one name serves both the animal and the meal.",
   zh:"後來，兩個群體逐漸融合成同一個民族。兩套詞彙都留了下來，但各司其職：農場用動物名，餐桌用肉的名稱。小牛肉 veal 和鹿肉 venison 也是同樣的規則。相反地，雞和魚是人人都吃的食物，所以動物和料理共用同一個名稱。"},
  {en:"This [[duality|duality]] still [[endures|endure]]. Every menu is a small [[reminder|reminder]] of [[medieval|medieval]] England. [[Whenever|p_whenever]] you read one, remember that the [[linguistic|linguistic]] traces of history are hiding on your plate.",
   zh:"這種雙重性至今仍然存在。每一份菜單都是中世紀英格蘭的小小提醒。每當你讀菜單時，請記得：歷史的語言痕跡就藏在你的餐盤上。"}
 ]},
 9:{title:'Dress to De-Stress',zh:'穿出好心情、甩掉壓力',note:'羽羽用自己的話改寫的課文重點版',paras:[
  {en:"Tomorrow is your big [[presentation|presentation]]. You open your [[wardrobe|wardrobe]], and every choice feels wrong. The colors look dull, and the style does not match your mood. What you may need is some dopamine dressing: picking clothes because they lift your spirits. The idea became popular during the [[pandemic|pandemic]].",
   zh:"明天就要上台簡報了。你打開衣櫥，卻覺得每一件都不對勁：顏色悶悶的，款式也跟心情不搭。這時你可能需要一點「多巴胺穿搭」：挑選讓自己心情變好的衣服。這個概念在疫情期間開始流行。"},
  {en:"Dopamine is a brain chemical linked to happiness. It shows up when you [[accomplish|accomplish]] something hard or enjoy a tasty treat. Clothes you love, whether a new [[purchase|purchase]] or an old favorite, can [[trigger|trigger]] the same feeling and [[boost|boost]] your mood.",
   zh:"多巴胺是一種和快樂有關的腦內化學物質。當你完成困難的事，或享用美味點心時，它就會出現。你喜愛的衣服，不論是新買的還是穿慣的老朋友，也能引發同樣的感覺，讓心情變好。"},
  {en:"Color matters too. In color [[psychology|psychology]], every [[hue|hue]] is tied to a feeling. Blue is often calm. Brown suggests [[stability|stability]]. Red can raise your heart rate, and green is linked to creativity.",
   zh:"顏色也很重要。在色彩心理學裡，每一種色調都連結著一種感受。藍色常帶來平靜，棕色暗示穩定，紅色能讓心跳加快，綠色則和創造力有關。"},
  {en:"Another idea is called enclothed cognition: what you wear can change your [[mindset|mindset]]. [[Simply put|p_simply]], clothes carry meanings, and those meanings shape how we act. In one famous experiment, [[participants|participant]] in white lab coats paid better attention. They [[associated|p_associate]] the coats with [[precision|precision]], and that link seemed to [[sharpen|sharpen]] their thinking.",

const cv=$('#fx'),ctx=cv.getContext('2d');
let parts=[],raf=null;
function resize(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
const CC=['#7fb8f0','#e8677f','#ffffff','#bfe0ff','#ffb3c6','#5f8fe0','#a8d8f0','#ffd1da'];
function burst(x,y,n=50,o={}){
  const angle=o.angle==null?-Math.PI/2:o.angle,spread=o.spread==null?Math.PI*2:o.spread,power=o.power||9;
  for(let i=0;i<n;i++){
    const a=angle+(Math.random()-.5)*spread,v=power*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*5,h:9+Math.random()*12,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,wob:Math.random()*6.28,ws:.1+Math.random()*.2,c:CC[i%CC.length],life:0,max:120+Math.random()*80,rib:Math.random()<.5});
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<p.max&&p.y<innerHeight+40);
  for(const p of parts){
    p.life++;p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.wob+=p.ws;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,Math.cos(p.wob));
    ctx.globalAlpha=Math.min(1,(p.max-p.life)/30);ctx.fillStyle=p.c;
    if(p.rib)ctx.fillRect(-p.w*.3,-p.h,p.w*.6,p.h*2.2);else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=null;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
function burstEl(el,n=36){if(!el)return burst(innerWidth/2,innerHeight/2,n);const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n,{spread:Math.PI*1.6,power:8})}
function bigConfetti(){
  for(let i=0;i<3;i++)setTimeout(()=>{
    burst(innerWidth*.08,innerHeight*.8,60,{angle:-1.15,spread:.9,power:16});
    burst(innerWidth*.92,innerHeight*.8,60,{angle:-Math.PI+1.15,spread:.9,power:16});

  },i*260);
}
let AC;
function tone(fr,dur=.11,type='sine'){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    fr.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      const t=AC.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.7);
      o.start(t);o.stop(t+dur*1.9);
    });
  }catch(e){}
}

function say(text,rate=.9,count=true){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援發音 🥲');return}

    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1.05;if(voice)u.voice=voice;

}

/* ---- 出題 ---- */
function distract(w,n=3){
  const base=w.pos.split('/')[0];
  const others=WORDS.filter(x=>x.id!==w.id);
  let same=shuffle(others.filter(x=>x.pos.split('/')[0]===base&&(x.u===w.u)));
  if(same.length<n)same=same.concat(shuffle(others.filter(x=>x.pos.split('/')[0]===base&&x.u!==w.u)));
  let r=same.slice(0,n);
  if(r.length<n)r=r.concat(pick(others.filter(x=>!r.includes(x)),n-r.length));
  return r;
}
function qListen(w){
  return {t:'choice',wid:w.id,title:'👂 聽發音，選出正確的單字',body:`<button class="spk bigspk" data-a="qsay">🔊</button><div class="sub">再聽一次可以按喇叭</div>`,say:w.en,auto:1,
    opts:shuffle([w,...distract(w)]).map(x=>({label:x.en,ok:x.id===w.id})),why:`<b>${w.en}</b> ＝ ${esc(zhShort(w))}`,sayAfter:w.en};
}
function qMeaning(w){
  const ds=distract(w,6).filter(x=>zhShort(x)!==zhShort(w));const seen={};const use=[];
  ds.forEach(x=>{if(!seen[zhShort(x)]&&use.length<3){seen[zhShort(x)]=1;use.push(x)}});
  return {t:'choice',wid:w.id,title:'🎯 這個字是什麼意思？',body:`<div class="bigword">${w.en}</div><div class="row" style="justify-content:center;margin-top:6px">${spkBtns(w.en)}</div>`,say:w.en,
    opts:shuffle([w,...use]).map(x=>({label:esc(zhShort(x)),ok:x.id===w.id})),why:`<b>${w.en}</b>（${w.pos}）${esc(w.zh)}`,sayAfter:w.en};
}
function qCloze(w){
  const s=w.ex.replace(/\{(.+?)\}/,'<span class="blank" id="bl">　　　</span>');
  return {t:'choice',wid:w.id,cloze:w.en,title:'🧩 選一個字補進句子',body:`<div class="qsent">${s}</div><div class="sub" style="margin-top:8px">💬 ${esc(w.exzh)}</div>`,
    opts:shuffle([w,...distract(w)]).map(x=>({label:x.en,ok:x.id===w.id})),why:`<b>${w.en}</b>（${w.pos}）${esc(w.zh)}`,sayAfter:plain(w.ex)};
}
function qPhrase(p){
  const s=esc(p.s).replace('___','<span class="blank" id="bl">　　　</span>');
  return {t:'choice',cloze:p.a,title:'✨ 選出正確的片語或句型',body:`<div class="qsent">${s}</div>`,
    opts:shuffle([p.a,...p.o]).map(x=>({label:esc(x),ok:x===p.a})),why:`<b>${esc(p.zh)}</b><br>${esc(p.why)}`,sayAfter:p.s.replace('___',p.a)};
}
function qRoot(r){
  return {t:'choice',title:'🌱 字根小教室',body:`<div class="qsent">${esc(r[1])}</div>`,opts:shuffle([r[2],...r[3]]).map(x=>({label:esc(x),ok:x===r[2]})),why:esc(r[4])};

function qTrans(t){
  const chips=shuffle([...t.en.split(' '),...t.x].map((w,i)=>({id:'c'+i,w})));
  return {t:'trans',zh:t.zh,en:t.en,alts:t.alts,chips,why:esc(t.why),sayAfter:t.en};
}
function build(mode){
  const L=scoped(),pq=PQ.filter(p=>scope==='all'||p.u===scope),rt=ROOTS.filter(r=>scope==='all'||r[0]===scope);
  switch(mode){
    case 'listen':return pick(L,8).map(qListen);
    case 'meaning':return pick(L,8).map(qMeaning);
    case 'cloze':return pick(L,8).map(qCloze);
    case 'phrase':return pick(pq,Math.min(8,pq.length)).map(qPhrase);
    case 'roots':return pick(rt,Math.min(8,rt.length)).map(qRoot);
    case 'meat':return Array.from({length:8},qMeat);
    case 'trans':return pick(TRANS,5).map(qTrans);
    case 'mix':{
      const a=[...pick(L,3).map(qListen),...pick(L,3).map(qMeaning),...pick(L,2).map(qCloze),...pick(pq,Math.min(1,pq.length)).map(qPhrase),...pick(rt,1).map(qRoot)];
      return shuffle(a);
    }
  }
}

function rAch(){
  const inLv=S.xp%XPL,ln=LVN[Math.min(lvl()-1,LVN.length-1)];
  const grp=u=>`<div class="sec">Unit ${u} 羽毛收藏（${WORDS.filter(w=>w.u===u&&S.feathers[w.id]).length}/${WORDS.filter(w=>w.u===u).length}）</div><div class="card"><div class="fgrid">${WORDS.filter(w=>w.u===u).map(w=>`<button class="fchip ${S.feathers[w.id]?'':'lock'}" data-a="tok" data-id="${w.id}">🪶 ${w.en}</button>`).join('')}</div></div>`;
  return `<div class="card hero">${mascot()}<div style="flex:1"><div class="lvl">Lv.${lvl()}・${ln}</div><div class="bar" style="height:16px"><i style="width:${inLv/XPL*100}%;background:linear-gradient(90deg,var(--gold),var(--rose))"></i></div><div class="sub">再 ${XPL-inLv} XP 升級</div></div></div>
  <div class="card"><div class="stat"><div><b>🪶 ${featherN()}</b><span>羽毛</span></div><div><b>⭐ ${starsTotal()}</b><span>星星</span></div><div><b>🔥 ${S.bestCombo}</b><span>最高連擊</span></div><div><b>🔊 ${S.heard}</b><span>聽過發音</span></div></div></div>
  <div class="sec">徽章（${Object.keys(S.badges).length}/${BADGES.length}）</div>
  <div class="card"><div class="badges">${BADGES.map(b=>{const [c,m]=b.p(),got=S.badges[b.id];return `<div class="badge ${got?'':'lock'}"><div class="bi">${b.ic}</div><div><b>${b.n}</b><small>${got?b.d:b.d+'（'+Math.min(c,m)+'/'+m+'）'}</small></div></div>`}).join('')}</div></div>
  ${grp(8)}${grp(9)}
  <div class="row between" style="margin:4px 2px 10px"><button class="btn sm ghost" data-a="sound">${S.sound?'🔔 音效：開':'🔕 音效：關'}</button><button class="btn sm ghost" data-a="reset">重置進度</button></div>`;
}

/* ============ 事件 ============ */
const A={
 nav:d=>{closeSheet();if(view==='quiz'&&d.v!=='challenge'&&!confirm('要離開這場挑戰嗎？'))return;view=d.v;render()},
 unit:d=>{scope=d.u==='all'?'all':+d.u;fc.i=0;fc.flip=false;render(true)},
 pickunit:d=>{scope=+d.u;readTab=+d.u;fc.i=0;fc.flip=false;view='vocab';render()},
 fcmode:d=>{fc.mode=d.m;render(true)},
 flip:()=>{fc.flip=!fc.flip;$('.flip').classList.toggle('on',fc.flip);if(fc.flip)SFX.pop()},
 fcnav:d=>{const n=scoped().length;fc.i=(fc.i+ +d.d+n)%n;fc.flip=false;render(true);say(scoped()[fc.i].en,.9)},
 wl:(d,el)=>{el.classList.toggle('open')},
 say:d=>say(d.t,+d.r||.9),
 qsay:()=>say(quiz.qs[quiz.i].say,.8,false),
 collect:(d,el)=>{
   if(S.feathers[d.id]){toast('這片羽毛已經在收藏裡囉 🪶');return}
   collect(d.id);burstEl(el,40);
   if(view==='vocab')render(true);else if(el)el.textContent='🪶 已在收藏裡';
 },
 tok:d=>openSheet(d.id),
 closesheet:closeSheet,
 closemodal:closeModal,
 rtab:d=>{readTab=+d.u;render()},
 zh:(d,el)=>{const z=$('#zh'+d.i);z.classList.toggle('show');el.textContent=z.classList.contains('show')?'🙈 收起中文':'🇹🇼 看整段中文'},
 readpara:d=>say(PASS[readTab].paras[+d.i].en.replace(/\[\[(.+?)\|.+?\]\]/g,'$1'),.85,false),
 readdone:(d,el)=>{
   const first=!S.read[readTab];S.read[readTab]=1;
   if(first){addXP(20);questTick('read')}
   SFX.win();bigConfetti();toast(first?'📖 讀完課文！　+20 XP':'📖 再讀一次，記得更牢！');progress();render(true);
 },
 startquiz:d=>{closeSheet();startQuiz(d.m)},
 opt:d=>choose(+d.i),
 next:nextQ,
 quit:()=>{if(confirm('要離開這場挑戰嗎？')){view='challenge';render()}},
 chip:d=>{if(quiz.done)return;quiz.tr.placed.push(d.id);SFX.pop();render(true)},
 unchip:d=>{if(quiz.done)return;quiz.tr.placed=quiz.tr.placed.filter(x=>x!==d.id);render(true)},
 clear:()=>{if(quiz.done)return;quiz.tr.placed=[];render(true)},
 check:()=>{
   if(quiz.done)return;const q=quiz.qs[quiz.i];
   if(!quiz.tr.placed.length){toast('先點單字排句子喔 ✨');return}
   const a=norm(transAnswer());
   if([q.en,...q.alts].map(norm).includes(a)){
     if(quiz.tr.fails<2){S.transDone++}
     finishQ(quiz.tr.fails<2,$('#ans'));
     const an=$('#ans');if(an)an.style.borderColor='var(--good)';
     document.querySelectorAll('.chip,.btn.ghost,.btn.good:not(.sm)').forEach(b=>{if(b.dataset.a!=='next')b.disabled=true});
   }else{
     quiz.tr.fails++;SFX.bad();quiz.combo=0;
     const an=$('#ans');an.classList.remove('shake');void an.offsetWidth;an.classList.add('shake');
     toast(quiz.tr.fails>=2?'再試一次，或按「看答案」':'還不太對，換個順序試試 💪');
     if(quiz.tr.fails===2)render(true);
   }
 },
 reveal:()=>{
   if(quiz.done)return;const q=quiz.qs[quiz.i];quiz.done=true;quiz.combo=0;SFX.bad();
   fbShow(false,`正確答案：<b>${esc(q.en)}</b><br>${q.why}`,false);
   setTimeout(()=>say(q.en,.85,false),300);
   document.querySelectorAll('.chip,.btn:not(.sm)').forEach(b=>b.disabled=true);
 },
 sound:()=>{S.sound=!S.sound;save();render(true)},
 reset:()=>{if(confirm('確定要清掉所有進度嗎？')){try{localStorage.removeItem(KEY)}catch(e){}S={xp:0,feathers:{},heard:0,rounds:0,perfect:0,bestCombo:0,stars:{},read:{},transDone:0,badges:{},quest:null,allQuest:0,sound:true};save();render()}}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const f=A[t.dataset.a];if(f)f(t.dataset,t,e);
});

/* 背景羽毛 */
(function(){
  const box=$('#fallers');
  for(let i=0;i<10;i++){
    const d=document.createElement('div');d.className='fall';
    const sz=8+Math.random()*26;
    d.style.width=d.style.height=sz+'px';d.style.left=(3+i*9.5+Math.random()*5)+'%';
    d.style.animationDuration=(14+Math.random()*14)+'s';d.style.animationDelay=(-Math.random()*22)+'s';
    box.appendChild(d);
  }
})();

Qs();render();
</script>
</body>
